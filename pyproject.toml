[project]
name = "llsvm"
version = "0.1.0"
description = "SVM classifiers on text embeddings"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads or loads a real model"]
