[project]
name = "llsvm"
version = "0.1.0"
description = "SVM classifiers on text embeddings"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: downloads or loads a real model"]
